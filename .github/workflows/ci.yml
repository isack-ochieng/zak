name: ZAK compiler CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run compiler tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace --release

      - name: Set up Node.js for the editor extension
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and package the VS Code extension
        working-directory: editors/vscode
        run: |
          node -e "for (const file of ['package.json', 'language-configuration.json', 'syntaxes/zak.tmLanguage.json', 'snippets/zak.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
          npx --yes @vscode/vsce package --no-dependencies
